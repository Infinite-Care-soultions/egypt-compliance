[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "egypt-compliance"
version = "0.1.0"
description = "Python SDK for Egyptian Tax Authority (ETA) eInvoicing integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Beshoy" }]
keywords = ["egypt", "eta", "einvoicing", "compliance", "tax"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "cryptography>=42",
    "asn1crypto>=1.5",
    "python-pkcs11>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.urls]
Homepage = "https://sdk.invoicing.eta.gov.eg/api/01-login-as-taxpayer-system/"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
